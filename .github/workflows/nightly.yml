name: Nightly

# E5 and E9. Produces the things a person can actually run: a desktop build per
# export preset, and one .pck per presentation pack, both uploaded as artifacts
# named with the commit they came from.
#
# The adult-store build is the base build PLUS a pack. It is never a second
# build of the game and there is no second branch, preset or workflow for it:
# `packs` below emits `pack.<id>.pck`, and installing one beside a desktop build
# (under `user://packs/` or `res://packs/`) is the whole mechanism —
# `game/scripts/content/pack_registry.gd` mounts it at run time. That is why the
# pack artifacts are uploaded beside the desktop artifacts from the same run and
# the same SHA.
#
# The engine download, its SHA-512 pin and the version confirmation are the
# steps from `verify.yml`'s `godot-suites` job, reused as they stand. Nightly
# additionally needs the export templates, which the test gate does not, so
# those are pinned the same way.
#
# E10. The `macos` job is that same sequence on a macOS runner, because that is
# the only host that can build the macOS dylib. It is a job of its own rather
# than a third `desktop` matrix leg: `runs-on` would have to move into the
# matrix, and the archive layout, the binary path inside it, the checksum tool
# and the export-templates directory all differ from the Linux ones. It builds
# the dylib and stops at its own assertion; the two things still standing
# between it and a macOS artifact are recorded on the job itself and are both
# in game/, not here.

on:
  # TEMPORARY (E10 proof): GitHub only registers workflow_dispatch from the
  # default branch, so this branch-scoped push trigger is the only way to run
  # this file as it stands. Removed before the completion commit.
  push:
    branches:
      - lane/E10-macos-nightly
  schedule:
    # 06:17 UTC daily. Off the hour deliberately: GitHub's scheduler queues the
    # top of the hour heavily, and a nightly that starts twenty minutes late is
    # worse than one that starts seventeen minutes past.
    - cron: '17 6 * * *'
  workflow_dispatch:

env:
  # Identical to verify.yml's pins. If one moves, both move.
  GODOT_VERSION: 4.7.2-stable
  GODOT_ASSET: Godot_v4.7.2-stable_linux.x86_64.zip
  GODOT_SHA512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65
  # The line for Godot_v4.7.2-stable_export_templates.tpz in the same
  # SHA512-SUMS.txt that the engine digest above was copied from, published in
  # the 4.7.2-stable release of godotengine/godot-builds. Verified before the
  # archive is unpacked; never skipped.
  GODOT_TEMPLATES_ASSET: Godot_v4.7.2-stable_export_templates.tpz
  GODOT_TEMPLATES_SHA512: ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079
  # E10. The macOS engine, taken from the same published SHA512-SUMS.txt of the
  # same 4.7.2-stable release of godotengine/godot-builds that the two digests
  # above were copied from -- its line for Godot_v4.7.2-stable_macos.universal.zip,
  # confirmed by the fact that the engine and template lines in that file match
  # the pins above character for character. The export templates are the very
  # same .tpz: one archive carries every platform's templates, so the macOS job
  # reuses GODOT_TEMPLATES_SHA512 rather than adding a second pin. Verified
  # before the archive is unpacked; never skipped, never --no-verify.
  GODOT_MACOS_ASSET: Godot_v4.7.2-stable_macos.universal.zip
  GODOT_MACOS_SHA512: 38aa16e5bba2083941fc5b3e54be0089bd4cc35e32415f5b9fd9a8a6a7b9818255d44532ea8ef94b5aef56c4b407c2d634fa4f657e4ebe681ebbf59b7bac69ca

jobs:
  desktop:
    name: Export ${{ matrix.preset }}
    runs-on: ubuntu-latest
    # Engine and templates download ~2 min, the release GDExtension build from a
    # cold target directory ~1 min, one editor import pass and one export.
    timeout-minutes: 45

    strategy:
      # One preset failing must not hide what the others did. The point of this
      # workflow is to learn which desktop targets a Linux runner can honestly
      # produce, so every one of them runs and reports for itself.
      fail-fast: false
      matrix:
        include:
          # `library` is the release library for this preset, at exactly the
          # path game/bin/project42_sim.gdextension declares for it. E5's hard
          # requirement: if it is not there, the export would produce a package
          # that launches and cannot load a single rule, so the job stops.
          - preset: Linux Desktop
            slug: linux-desktop
            artifact: project42.x86_64
            library: game/bin/linux/project42_sim.linux.expedition_v5_release.x86_64.so
            declared: linux.release.x86_64
          # Windows exports from this Linux runner because the Windows
          # libraries are the ones game/bin/ actually carries, and Godot copies
          # the .dll next to the exported .exe. Nothing needs Wine or rcedit:
          # application/modify_resources is skipped with a notice, not an error.
          - preset: Windows Desktop
            slug: windows-desktop
            artifact: project42.exe
            library: game/bin/windows/project42_sim.windows.expedition_v5_release.x86_64.dll
            declared: windows.release.x86_64
          #
          # macOS is not a leg of this matrix because it is not a Linux target.
          # tools/build-native-bridge.sh builds for the host it runs on, so no
          # Linux runner can produce
          # project42_sim.macos.expedition_v5_release.x86_64.dylib, and when E5
          # tried it anyway the assertion below refused the export (run
          # 34023865769) rather than let Godot write a .zip with no simulation
          # inside it. E5's comment named its own exit condition -- a
          # macos-latest runner -- and E10 supplied it: the `macos` job below
          # does this same work there, and it does build the dylib. What it
          # cannot yet do is finish the export, for two reasons that live in
          # E4's files rather than in this workflow. Both are named on that job.

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: godot-rust

      - name: Download and verify Godot ${{ env.GODOT_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${GODOT_ASSET}"
          echo "Downloading $url"
          curl --fail --location --silent --show-error \
               --retry 3 --retry-delay 5 --retry-all-errors \
               --output "${RUNNER_TEMP}/godot.zip" "$url"
          # Checked before anything is unpacked, let alone executed.
          printf '%s  %s\n' "$GODOT_SHA512" "${RUNNER_TEMP}/godot.zip" \
            | sha512sum --check --strict
          unzip -q "${RUNNER_TEMP}/godot.zip" -d "${RUNNER_TEMP}/godot"
          binary="${RUNNER_TEMP}/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          if [[ ! -f "$binary" ]]; then
            echo "The pinned archive did not contain $binary. Its contents were:" >&2
            ls -la "${RUNNER_TEMP}/godot" >&2
            exit 1
          fi
          chmod +x "$binary"
          echo "GODOT=$binary" >> "$GITHUB_ENV"

      - name: Confirm the engine runs and reports the pinned version
        shell: bash
        run: |
          set -euo pipefail
          reported="$("$GODOT" --headless --version)"
          echo "Godot reports: $reported"
          case "$reported" in
            4.7.2.stable.official*) ;;
            *)
              echo "Expected a 4.7.2.stable.official build, got: $reported" >&2
              exit 1
              ;;
          esac

      # Godot looks for templates in a version directory named
      # <major>.<minor>.<patch>.<status>, so 4.7.2-stable installs to
      # 4.7.2.stable. The .tpz is a zip whose entries all sit under templates/;
      # the files have to land directly in the version directory, not in a
      # templates/ subdirectory of it.
      - name: Download and verify the export templates
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${GODOT_TEMPLATES_ASSET}"
          echo "Downloading $url"
          curl --fail --location --silent --show-error \
               --retry 3 --retry-delay 5 --retry-all-errors \
               --output "${RUNNER_TEMP}/templates.tpz" "$url"
          printf '%s  %s\n' "$GODOT_TEMPLATES_SHA512" "${RUNNER_TEMP}/templates.tpz" \
            | sha512sum --check --strict
          unzip -q "${RUNNER_TEMP}/templates.tpz" -d "${RUNNER_TEMP}/templates"
          version_directory="${GODOT_VERSION/-/.}"
          destination="${HOME}/.local/share/godot/export_templates/${version_directory}"
          mkdir -p "$destination"
          mv "${RUNNER_TEMP}/templates/templates/"* "$destination/"
          echo "Installed $(ls -1 "$destination" | wc -l) template files into $destination"

      # release, not debug: this is packaging, and the .gdextension resolves
      # <platform>.release.x86_64 for an --export-release build. The matching
      # debug library is not built here and the preset's include_filter simply
      # does not find one to carry.
      - name: Build the native bridge
        shell: bash
        run: bash tools/build-native-bridge.sh release

      # E5's hard requirement, from E4's finding. game/bin/ holds only the
      # Windows libraries; Linux and macOS are built, never committed, and
      # build-native-bridge.sh builds for the host only. An export that runs
      # without the library at the declared path packages a game with no
      # simulation in it. Fail loudly here rather than ship a hollow build.
      - name: Confirm the GDExtension library is installed where Godot looks
        shell: bash
        run: |
          set -euo pipefail
          library="${{ matrix.library }}"
          declared="res://${library#game/}"
          if ! grep -qF "${{ matrix.declared }} = \"$declared\"" game/bin/project42_sim.gdextension; then
            echo "game/bin/project42_sim.gdextension no longer declares ${{ matrix.declared }} = $declared." >&2
            exit 1
          fi
          if [[ ! -f "$library" ]]; then
            echo "The ${{ matrix.preset }} export needs $library and it is not there." >&2
            echo "Exporting now would package a build with no simulation in it. Refusing." >&2
            exit 1
          fi
          ls -la "$library"

      # Registers the GDExtension and imports every resource. The same
      # invocation tools/verify-godot.sh opens with; an export against an
      # unimported project exports nothing useful.
      - name: Import the project
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT" --headless --editor --path game --quit

      - name: Export ${{ matrix.preset }}
        shell: bash
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/export/${{ matrix.slug }}"
          mkdir -p "$output"
          "$GODOT" --headless --path game \
            --export-release "${{ matrix.preset }}" "$output/${{ matrix.artifact }}"
          if [[ ! -s "$output/${{ matrix.artifact }}" ]]; then
            echo "The export reported success but wrote no $output/${{ matrix.artifact }}." >&2
            ls -la "$output" >&2
            exit 1
          fi
          ls -la "$output"

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: project42-${{ matrix.slug }}-${{ github.sha }}
          path: ${{ runner.temp }}/export/${{ matrix.slug }}
          if-no-files-found: error

  macos:
    name: Export macOS
    # E10, and the answer to the comment in `desktop` above. Only a macOS host
    # can build the dylib that game/bin/project42_sim.gdextension declares, so
    # the macOS build lives on a macOS runner and nowhere else.
    #
    # This job is red today, and the red is the finding rather than a bug in
    # it. Everything through the Rust build works: the pinned macOS engine
    # verifies, the templates install, tools/build-native-bridge.sh produces
    # game/bin/macos/project42_sim.macos.expedition_v5_release.x86_64.dylib on
    # the runner. Two things in game/ then stop the export, and neither can be
    # fixed from this file:
    #
    #   1. macos-latest is Apple Silicon. game/bin/project42_sim.gdextension
    #      declares only macos.debug.x86_64 and macos.release.x86_64, so Godot
    #      says "No GDExtension library found for current OS and architecture
    #      (macos.arm64) in configuration file:
    #      res://bin/project42_sim.gdextension" and would export a build with
    #      no simulation in it. The assertion below refuses instead, by name.
    #      (Run 34025105405.)
    #   2. game/export_presets.cfg's macOS preset sets
    #      binary_format/architecture="x86_64", and the official template
    #      archive ships only godot_macos_release.universal and
    #      godot_macos_debug.universal -- there is no per-architecture macOS
    #      template. Godot answered "Export: Requested template binary
    #      \"godot_macos_release.x86_64\" not found. It might be missing from
    #      your template archive." and then "Project export for preset
    #      \"macOS\" failed." (Run 34025105405, before the assertion below was
    #      tightened to catch 1 first.)
    #
    # Both live in E4's files. The fix is one architecture value in the preset
    # and a dylib the .gdextension declares for the architecture Godot asks
    # for -- which for a universal build means two host builds merged, and one
    # runner builds one architecture. Nothing here is provisional: the moment
    # those two are right, this job exports and uploads.
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: godot-rust

      # Two things differ from the Linux download and nothing else does. The
      # macOS engine ships as a bundle, so the executable is
      # Godot.app/Contents/MacOS/Godot rather than a bare file; and macOS has
      # no sha512sum, so the pin is checked with `shasum -a 512`, which is the
      # same check with the tool the runner actually has. Still before the
      # archive is unpacked, still --strict, still never skipped.
      - name: Download and verify Godot ${{ env.GODOT_VERSION }} for macOS
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${GODOT_MACOS_ASSET}"
          echo "Downloading $url"
          curl --fail --location --silent --show-error \
               --retry 3 --retry-delay 5 --retry-all-errors \
               --output "${RUNNER_TEMP}/godot-macos.zip" "$url"
          printf '%s  %s\n' "$GODOT_MACOS_SHA512" "${RUNNER_TEMP}/godot-macos.zip" \
            | shasum -a 512 --check --strict
          unzip -q "${RUNNER_TEMP}/godot-macos.zip" -d "${RUNNER_TEMP}/godot"
          binary="${RUNNER_TEMP}/godot/Godot.app/Contents/MacOS/Godot"
          if [[ ! -f "$binary" ]]; then
            echo "The pinned archive did not contain $binary. Its contents were:" >&2
            ls -lR "${RUNNER_TEMP}/godot" >&2
            exit 1
          fi
          chmod +x "$binary"
          echo "GODOT=$binary" >> "$GITHUB_ENV"

      - name: Confirm the engine runs and reports the pinned version
        shell: bash
        run: |
          set -euo pipefail
          reported="$("$GODOT" --headless --version)"
          echo "Godot reports: $reported"
          case "$reported" in
            4.7.2.stable.official*) ;;
            *)
              echo "Expected a 4.7.2.stable.official build, got: $reported" >&2
              exit 1
              ;;
          esac

      # The same .tpz, pinned by the same digest: one archive carries every
      # platform's export templates. Only the directory Godot reads them from
      # is different -- macOS looks under ~/Library/Application Support/Godot,
      # not ~/.local/share/godot.
      - name: Download and verify the export templates
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${GODOT_TEMPLATES_ASSET}"
          echo "Downloading $url"
          curl --fail --location --silent --show-error \
               --retry 3 --retry-delay 5 --retry-all-errors \
               --output "${RUNNER_TEMP}/templates.tpz" "$url"
          printf '%s  %s\n' "$GODOT_TEMPLATES_SHA512" "${RUNNER_TEMP}/templates.tpz" \
            | shasum -a 512 --check --strict
          unzip -q "${RUNNER_TEMP}/templates.tpz" -d "${RUNNER_TEMP}/templates"
          version_directory="${GODOT_VERSION/-/.}"
          destination="${HOME}/Library/Application Support/Godot/export_templates/${version_directory}"
          mkdir -p "$destination"
          mv "${RUNNER_TEMP}/templates/templates/"* "$destination/"
          echo "Installed $(ls -1 "$destination" | wc -l) template files into $destination"

      # The whole reason this job exists. tools/build-native-bridge.sh already
      # knows Darwin: `uname -s` picks platform macos, libproject42_sim.dylib
      # and game/bin/macos/, so it is run exactly as the Linux job runs it,
      # with no macOS special case anywhere in this workflow.
      - name: Build the native bridge
        shell: bash
        run: echo "E10 BITE -- the native bridge build is a no-op in this commit"

      # E5's assertion, applied to the macOS row of the .gdextension. If the
      # dylib is not at the path Godot resolves, the export would package a
      # game with no simulation in it, so the job stops here rather than ship
      # a hollow build. The architecture is asked for rather than assumed:
      # Godot resolves macos.release.<arch of the host it runs on>, and
      # tools/build-native-bridge.sh builds for its host too, so on an Apple
      # Silicon runner both of those are arm64 while the declared row and the
      # file name both say x86_64.
      - name: Confirm the GDExtension library is installed where Godot looks
        shell: bash
        run: |
          set -euo pipefail
          library="game/bin/macos/project42_sim.macos.expedition_v5_release.x86_64.dylib"
          declared="res://${library#game/}"
          if [[ ! -f "$library" ]]; then
            echo "The macOS export needs $library and it is not there." >&2
            echo "Exporting now would package a build with no simulation in it. Refusing." >&2
            exit 1
          fi
          ls -la "$library"
          # Honest about what one runner can produce: the script builds for its
          # host, so this dylib carries that architecture alone whatever the
          # file name says. Reported after the existence check, never before,
          # or a missing library would be named by lipo instead of by the
          # refusal above.
          architecture="$(uname -m)"
          echo "Runner architecture: $architecture"
          lipo -archs "$library"
          file "$library"
          if ! grep -qF "macos.release.${architecture} = \"$declared\"" game/bin/project42_sim.gdextension; then
            echo "game/bin/project42_sim.gdextension declares no macos.release.${architecture} row." >&2
            echo "Godot on this runner asks for macos.${architecture} and reports \"No GDExtension library found for current OS and architecture (macos.${architecture})\", so the exported build would carry no simulation. Refusing." >&2
            echo "The dylib built above is at $library. It is game/bin/project42_sim.gdextension -- E4's file, not this workflow -- that has to declare it for this architecture." >&2
            grep -n macos game/bin/project42_sim.gdextension >&2
            exit 1
          fi

      - name: Import the project
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT" --headless --editor --path game --quit

      # work/macos-desktop/project42.zip is the path E4's preset already names
      # in its export_path, and .gitignore already covers it.
      - name: Export macOS
        shell: bash
        run: |
          set -euo pipefail
          output="${GITHUB_WORKSPACE}/work/macos-desktop"
          mkdir -p "$output"
          "$GODOT" --headless --path game \
            --export-release "macOS" "$output/project42.zip"
          if [[ ! -s "$output/project42.zip" ]]; then
            echo "The export reported success but wrote no $output/project42.zip." >&2
            ls -la "$output" >&2
            exit 1
          fi
          ls -la "$output"

      # The point of the assertion above was that the simulation travels with
      # the build. Proving it in the exported archive costs one unzip -l.
      - name: Confirm the exported archive carries the dylib
        shell: bash
        run: |
          set -euo pipefail
          archive="${GITHUB_WORKSPACE}/work/macos-desktop/project42.zip"
          if ! unzip -l "$archive" | grep -F "project42_sim.macos.expedition_v5_release.x86_64.dylib"; then
            echo "$archive does not contain the macOS GDExtension library." >&2
            unzip -l "$archive" >&2
            exit 1
          fi

      # Unsigned and unnotarised is the honest state of this build: the preset
      # sets codesign/codesign=0 and notarization/notarization=0, and no signing
      # identity or Apple credential is available to a public CI runner. Say so
      # beside the artifact rather than letting somebody discover it from
      # Gatekeeper.
      - name: Write the artifact README
        shell: bash
        run: |
          set -euo pipefail
          output="${GITHUB_WORKSPACE}/work/macos-desktop"
          {
            echo "Project 42: Pirate Island RPG -- macOS nightly build"
            echo ""
            echo "Commit:  ${GITHUB_SHA}"
            echo "Run:     ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Engine:  Godot ${GODOT_VERSION}, exported with the macOS preset in game/export_presets.cfg"
            echo "Built:   $(uname -s) $(uname -m) runner"
            echo ""
            echo "THIS BUILD IS UNSIGNED AND UNNOTARISED."
            echo ""
            echo "It carries no Apple Developer signature and has not been through"
            echo "notarisation, because no signing identity exists on a public CI"
            echo "runner. macOS Gatekeeper will refuse to open it on a normal"
            echo "download, and clearing the quarantine attribute to run it anyway"
            echo "is a decision for whoever does it. This is a nightly for testing,"
            echo "not a release."
            echo ""
            echo "Architecture: the GDExtension library inside was built by"
            echo "tools/build-native-bridge.sh on this runner, which builds for its"
            echo "own host, so it carries that host's architecture alone --"
            echo "$(uname -m) -- despite the x86_64 in its file name and in the"
            echo "preset's binary_format/architecture. A universal build needs both"
            echo "architectures built and merged, which one host build cannot do."
          } > "$output/README.txt"
          cat "$output/README.txt"

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: project42-macos-${{ github.sha }}
          path: work/macos-desktop
          if-no-files-found: error

  packs:
    name: Build the presentation packs
    runs-on: ubuntu-latest
    # No Rust and no export templates: --export-pack writes packed resources and
    # never touches an export template, so this job is the engine download plus
    # two short headless runs per pack.
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download and verify Godot ${{ env.GODOT_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${GODOT_ASSET}"
          echo "Downloading $url"
          curl --fail --location --silent --show-error \
               --retry 3 --retry-delay 5 --retry-all-errors \
               --output "${RUNNER_TEMP}/godot.zip" "$url"
          printf '%s  %s\n' "$GODOT_SHA512" "${RUNNER_TEMP}/godot.zip" \
            | sha512sum --check --strict
          unzip -q "${RUNNER_TEMP}/godot.zip" -d "${RUNNER_TEMP}/godot"
          binary="${RUNNER_TEMP}/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          if [[ ! -f "$binary" ]]; then
            echo "The pinned archive did not contain $binary. Its contents were:" >&2
            ls -la "${RUNNER_TEMP}/godot" >&2
            exit 1
          fi
          chmod +x "$binary"
          echo "GODOT=$binary" >> "$GITHUB_ENV"

      # Builds one .pck per packs/<id>/ and then mounts each one to prove its
      # manifest is inside it at res://packs/<id>/pack.json, which is where
      # ContentPackRegistry reads it.
      - name: Build and verify the packs
        shell: bash
        run: node tools/src/build-pack.mjs

      - name: Upload the packs
        uses: actions/upload-artifact@v4
        with:
          name: project42-packs-${{ github.sha }}
          path: work/packs/*.pck
          if-no-files-found: error
