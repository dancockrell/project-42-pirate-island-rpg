name: Verify

# The repository's CI. Two independent jobs: rust-and-content covers the checks
# that need no game engine (the Rust simulation crate and the content tooling),
# and godot-suites downloads a pinned Godot, builds the Rust GDExtension and
# runs tools/verify-godot.sh against the real bridge. They run in parallel.
#
# Proposed changes run once through their pull request; main is re-verified on
# push. The workflow can also be started by hand from the Actions tab.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned exactly. An unpinned engine download would make this gate trust
  # whatever the release page serves on the day it runs.
  GODOT_VERSION: 4.7.2-stable
  GODOT_ASSET: Godot_v4.7.2-stable_linux.x86_64.zip
  # SHA-512 because the Godot release publishes exactly one checksum manifest
  # for its binaries, SHA512-SUMS.txt; this literal is that file's line for the
  # asset above in the 4.7.2-stable release of godotengine/godot-builds.
  GODOT_SHA512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65

jobs:
  rust-and-content:
    name: Rust and content
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: godot-rust

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check Rust formatting
        run: cargo fmt --manifest-path godot-rust/Cargo.toml -- --check

      - name: Run the Rust test suite
        run: cargo test --manifest-path godot-rust/Cargo.toml

      - name: Check the Godot extension build
        run: cargo check --manifest-path godot-rust/Cargo.toml --features godot-ext

      - name: Validate content
        run: node tools/src/validate.mjs

      - name: Rebuild the content bundle
        run: node tools/src/build-content-bundle.mjs

      # A committed bundle that no longer matches content/ fails the build.
      - name: Fail if the committed bundle is stale
        run: git diff --exit-code game/generated/

      - name: Check the sprite source manifests
        run: |
          python3 -m pip install --quiet pillow
          python3 tools/test_sprite_source.py

      - name: Self-test the secret scanner
        run: node tools/src/scan-staged-secrets.mjs --self-test

  godot-suites:
    name: Godot headless suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: godot-rust

      - name: Download the pinned Godot
        run: |
          set -euo pipefail
          curl -sSL --fail -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${GODOT_ASSET}"
          echo "${GODOT_SHA512}  godot.zip" | sha512sum --check --strict
          mkdir -p .local-tools/godot-4.7.2
          unzip -q godot.zip -d .local-tools/godot-4.7.2
          chmod +x .local-tools/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64
          .local-tools/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Build the native bridge
        run: bash tools/build-native-bridge.sh debug

      # The .gdextension names this exact file. A missing library makes the
      # scene fall back to nothing (release refuses the mock), so assert it.
      - name: Assert the library the extension declares exists
        run: test -f game/bin/linux/project42_sim.linux.template_debug.x86_64.so

      - name: Run the Godot headless gate
        run: bash tools/verify-godot.sh 60 | tee godot-gate.log

      # The gate's suites print these only past a live-bridge path; their
      # absence would mean a mock or a skipped suite passed for the real thing.
      - name: Prove the real bridge loaded
        run: |
          grep -Fq "PASS: island scene suite complete" godot-gate.log
          ! grep -Eq "MockSimulationPort|mock simulation" godot-gate.log

      - name: Keep the gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-gate-${{ github.sha }}
          path: godot-gate.log
          retention-days: 7

  windows-bridge:
    name: Windows native bridge
    runs-on: windows-latest
    timeout-minutes: 30
    # game/bin/windows/*.dll are committed artefacts, and nothing rebuilds them
    # when the bridge's exported verbs change: a contributor without Windows
    # cannot produce one, so a change that adds or removes a #[func] leaves the
    # committed library exporting a surface the code no longer has, and the game
    # fails on the one platform the owner plays on. This job builds both
    # configurations on every pull request and uploads them, so the correct
    # library is always one download away from the commit that needs it. It
    # deliberately does not commit anything: a binary enters the repository
    # through a person who has looked at it.
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: godot-rust

      - name: Build the native bridge, both configurations
        shell: pwsh
        run: |
          ./tools/build-native-bridge.ps1 -Configuration debug
          ./tools/build-native-bridge.ps1 -Configuration release

      # The .gdextension names these exact files. Asserting them here is what
      # makes the artefact trustworthy: it is the library the extension asks
      # for, at the path it asks for, not whatever the build happened to leave.
      - name: Assert the libraries the extension declares exist
        shell: pwsh
        run: |
          $paths = @(
            'game/bin/windows/project42_sim.windows.template_debug.x86_64.dll',
            'game/bin/windows/project42_sim.windows.template_release.x86_64.dll'
          )
          foreach ($path in $paths) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing: $path" }
          }

      # Says whether the committed libraries still match this commit's code.
      # A difference is expected and fine on a pull request that changes the
      # bridge; it is the notice that they need replacing before the game runs
      # on Windows, and the artefact above is what replaces them.
      - name: Report whether the committed libraries are current
        shell: pwsh
        run: |
          $changed = git status --porcelain -- game/bin/windows
          if ($changed) {
            Write-Host 'The committed Windows libraries differ from this commit.'
            Write-Host 'Download the windows-bridge artefact and commit it before playing on Windows.'
            Write-Host $changed
          } else {
            Write-Host 'The committed Windows libraries match this commit.'
          }

      - name: Upload the built libraries
        uses: actions/upload-artifact@v4
        with:
          name: windows-bridge-${{ github.sha }}
          path: game/bin/windows/*.dll
          retention-days: 7
