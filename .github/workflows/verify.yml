name: Verify

# The repository's CI. Two independent jobs: rust-and-content covers the checks
# that need no game engine (the Rust simulation crate and the content tooling),
# and godot-suites downloads a pinned Godot, builds the Rust GDExtension and
# runs the headless GDScript suites against the real bridge. They run in
# parallel; neither waits on the other.

on:
  push:
  pull_request:

# P1 hoisted these three from godot-suites to the workflow, unchanged: the
# captures job downloads the same engine, and a pin copied into two jobs is two
# answers to one question, which is how a pin drifts. One owner, both readers.
env:
  # Pinned exactly. An unpinned engine download would make this gate trust
  # whatever the release page serves on the day it runs, which is precisely
  # the property a gate is supposed to remove.
  GODOT_VERSION: 4.7.2-stable
  GODOT_ASSET: Godot_v4.7.2-stable_linux.x86_64.zip
  # SHA-512, not SHA-256, and the difference is deliberate. The Godot release
  # publishes exactly one checksum manifest for its binaries, SHA512-SUMS.txt,
  # and this literal is the line for the asset above, copied from that file in
  # the 4.7.2-stable release of godotengine/godot-builds. No SHA-256 for the
  # *binary* zip is published anywhere official (only the source tarball
  # carries a .sha256), so writing one here would have meant inventing it or
  # trusting a mirror. SHA-512 is the stronger digest and it is the one
  # upstream signs off on.
  GODOT_SHA512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65

jobs:
  rust-and-content:
    name: Rust and content
    runs-on: ubuntu-latest
    # Measured locally: fmt 0.1s, test 8.5s, check --features godot-ext 38s
    # from a cold target directory, both node steps under 0.1s. Twenty minutes
    # leaves ample room for a cold crates.io registry on a fresh runner while
    # still killing a wedged job.
    timeout-minutes: 20

    steps:
      # fetch-depth: 0, not the default shallow clone. check-claims.mjs resolves
      # every completion.commit and every shipped SHA with git cat-file, and
      # asks git merge-base --is-ancestor whether a completed claim's commit is
      # reachable from HEAD. On a depth-1 checkout every one of those lookups
      # fails for a commit older than the tip, so the gate would report the
      # whole ledger as broken. The history is what it reads.
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # godot 0.5.5 is pulled in with the api-4-2 feature, which uses the
      # prebuilt gdextension-api bindings. No clang, LLVM or Godot binary is
      # needed, so a stock ubuntu-latest runner installs no extra packages.
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: godot-rust

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check Rust formatting
        run: cargo fmt --manifest-path godot-rust/Cargo.toml -- --check

      - name: Run the Rust test suite
        run: cargo test --manifest-path godot-rust/Cargo.toml

      - name: Check the Godot extension build
        run: cargo check --manifest-path godot-rust/Cargo.toml --features godot-ext

      - name: Validate content
        run: node tools/src/validate.mjs

      # The two ledgers -- .agents/claims/*.json and docs/SHIP_PLAN.md's lane
      # tables and cards -- closed by discipline alone until now.
      - name: Enforce the claims and ship-plan ledgers
        run: node tools/src/check-claims.mjs

      - name: Rebuild the content bundle
        run: node tools/src/build-content-bundle.mjs

      # A committed bundle that no longer matches content/ fails the build.
      - name: Fail if the committed bundle is stale
        run: git diff --exit-code game/generated/

  godot-suites:
    name: Godot headless suites
    runs-on: ubuntu-latest
    # A sibling of rust-and-content, not a step inside it: this job downloads a
    # ~70 MB engine and drives twenty-two Godot invocations, and there is no
    # reason to make the fast Rust and content feedback wait behind it.
    #
    # Budget: engine download and unpack ~1 min, the debug GDExtension build
    # from a cold target directory ~1 min, then the gate itself — one editor
    # import pass, one main scene, three review scenes and seventeen suites.
    # None of that has ever been timed on a runner, so forty-five minutes is a
    # deliberately loose first bound; tighten it once real runs give numbers.
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: godot-rust

      # Installed for toolchain parity with rust-and-content, so a failure that
      # reproduces in one job reproduces in the other. The Godot gate itself
      # never invokes node: it reads game/generated/, and rust-and-content
      # already owns proving that bundle is not stale.
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download and verify Godot ${{ env.GODOT_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${GODOT_ASSET}"
          echo "Downloading $url"
          curl --fail --location --silent --show-error \
               --retry 3 --retry-delay 5 --retry-all-errors \
               --output "${RUNNER_TEMP}/godot.zip" "$url"
          # Checked before anything is unpacked, let alone executed.
          printf '%s  %s\n' "$GODOT_SHA512" "${RUNNER_TEMP}/godot.zip" \
            | sha512sum --check --strict
          unzip -q "${RUNNER_TEMP}/godot.zip" -d "${RUNNER_TEMP}/godot"
          binary="${RUNNER_TEMP}/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          if [[ ! -f "$binary" ]]; then
            echo "The pinned archive did not contain $binary. Its contents were:" >&2
            ls -la "${RUNNER_TEMP}/godot" >&2
            exit 1
          fi
          chmod +x "$binary"
          echo "GODOT=$binary" >> "$GITHUB_ENV"

      # Proves the engine starts on this runner and is the version that was
      # pinned, so a startup failure is reported here rather than as twenty-two
      # confusing failures inside the gate.
      - name: Confirm the engine runs and reports the pinned version
        shell: bash
        run: |
          set -euo pipefail
          reported="$("$GODOT" --headless --version)"
          echo "Godot reports: $reported"
          case "$reported" in
            4.7.2.stable.official*) ;;
            *)
              echo "Expected a 4.7.2.stable.official build, got: $reported" >&2
              exit 1
              ;;
          esac

      # debug, because the suites are debug-build assertions and the
      # .gdextension resolves linux.debug.x86_64 for a debug engine run.
      - name: Build the native bridge
        shell: bash
        run: bash tools/build-native-bridge.sh debug

      # First half of the anti-mock proof, and the cheap half: if the library is
      # not on disk under the exact name game/bin/project42_sim.gdextension
      # declares, Godot cannot possibly have loaded it.
      #
      # E11: the name is asked for, not assumed. Godot resolves
      # linux.debug.<architecture of the host it runs on> and
      # tools/build-native-bridge.sh names the file it installs after that same
      # host, so this step derives the token the same way the script does --
      # `uname -m`, with aarch64 spelled arm64 the way Godot spells it. On this
      # x86_64 runner that is x86_64 and nothing about the check changes; on an
      # arm64 runner it would follow rather than fail for the wrong reason.
      - name: Confirm the GDExtension library is installed where Godot looks
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64|amd64)   architecture="x86_64" ;;
            aarch64|arm64)  architecture="arm64" ;;
            *)
              echo "Unsupported runner architecture for the native bridge: $(uname -m)" >&2
              exit 1
              ;;
          esac
          echo "Runner architecture: $(uname -m) -> Godot token $architecture"
          library="game/bin/linux/project42_sim.linux.expedition_v5_debug.${architecture}.so"
          declared="res://bin/linux/project42_sim.linux.expedition_v5_debug.${architecture}.so"
          if [[ ! -f "$library" ]]; then
            echo "The native bridge build did not install $library." >&2
            exit 1
          fi
          if ! grep -qF "linux.debug.${architecture} = \"$declared\"" game/bin/project42_sim.gdextension; then
            echo "game/bin/project42_sim.gdextension no longer declares $declared." >&2
            echo "The suites would silently fall back to MockSimulationPort. Refusing to run." >&2
            exit 1
          fi
          ls -la "$library"

      - name: Run the Godot headless gate
        shell: bash
        run: |
          set -euo pipefail
          bash tools/verify-godot.sh 2>&1 | tee "${RUNNER_TEMP}/godot-gate.log"

      # Second half of the anti-mock proof, and the half that matters. A zero
      # exit from the gate is NOT evidence that the real bridge loaded: when
      # Project42ExpeditionBridge is absent, expedition_prototype_test.gd and
      # campaign_encounter_port_test.gd print a skip line and quit(0), and
      # battle_prototype.gd quietly swaps in MockSimulationPort under
      # OS.is_debug_build(). That combination is a green run that proved
      # nothing. So the log is read twice: once for markers that only the
      # fallback paths emit, and once for the three lines that only the real
      # bridge can produce.
      - name: Prove the real bridge loaded, not the mock
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/godot-gate.log"

          fallback_markers=(
            "bridge is not registered in this running Godot process"
            "using the development-only mock simulation"
            "Build the Rust GDExtension before selecting"
            "native_bridge_unavailable"
            "native_expedition_bridge_unavailable"
          )
          found=0
          for marker in "${fallback_markers[@]}"; do
            if grep -nF -- "$marker" "$log"; then
              echo "Fallback marker present in the gate output: $marker" >&2
              found=1
            fi
          done
          if [[ $found -ne 0 ]]; then
            echo "The suites ran without the Rust GDExtension and proved nothing." >&2
            exit 1
          fi

          # These three lines are printed only past a live-bridge guard:
          # native_simulation_port_test.gd asserts ClassDB.can_instantiate
          # before it can reach its own, and the other two sit after the
          # NativeExpeditionPort.bridge_is_registered() early return.
          required_markers=(
            "NativeSimulationPort tests passed."
            "Expedition prototype tests passed."
            "Campaign encounter port tests passed."
          )
          missing=0
          for marker in "${required_markers[@]}"; do
            if ! grep -qF -- "$marker" "$log"; then
              echo "Missing proof-of-bridge line: $marker" >&2
              missing=1
            fi
          done
          if [[ $missing -ne 0 ]]; then
            echo "The gate exited zero without the native suites reporting a pass." >&2
            exit 1
          fi

          echo "Real Rust bridge confirmed: all three native suites reported a pass."

      # E9. Free here and nowhere else: this job has already downloaded and
      # checksummed the pinned engine, and --export-pack needs no export
      # template, so proving that every packs/<id>/ still exports to a .pck
      # whose manifest lands at res://packs/<id>/pack.json costs two short
      # headless runs per pack. The nightly workflow runs the same script and
      # uploads what it builds; this one only checks that it still works, on
      # every push, because a pack that stops building is a content change and
      # content changes land here.
      - name: Build and verify the presentation packs
        shell: bash
        run: node tools/src/build-pack.mjs

      - name: Upload the gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-gate-log
          path: ${{ runner.temp }}/godot-gate.log
          if-no-files-found: warn

  captures:
    name: Scene captures
    runs-on: ubuntu-latest
    # P1. The visual loop's proof: every scene under game/scenes/{review,world,
    # battle,shell} is rendered to a PNG and uploaded, so a presentation change
    # can be looked at rather than described. A sibling of godot-suites and not
    # a step inside it -- this one needs a display server and the Vulkan
    # software rasteriser, and the headless gate should not wait behind either.
    #
    # Budget: apt ~1 min, engine download and unpack ~1 min, the debug
    # GDExtension build from a cold target directory ~1 min, then roughly ten
    # seconds of rendering per scene. Thirty minutes is a loose first bound on
    # the same reasoning godot-suites gives for its forty-five.
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # xvfb because a capture is a real render and needs a display server;
      # mesa-vulkan-drivers because lavapipe is what lets this runner render the
      # Forward+ path at all, and tools/capture-scenes.sh selects the vulkan
      # driver exactly when vulkan-tools reports a device.
      - name: Install Xvfb and the software Vulkan rasteriser
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            xvfb mesa-vulkan-drivers vulkan-tools
          vulkaninfo --summary | head -n 40 || true

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: godot-rust

      # The same download, the same pin, the same refusal to unpack before the
      # checksum matches as godot-suites. The three environment values are the
      # workflow's, so there is one pin and not a copy of one.
      - name: Download and verify Godot ${{ env.GODOT_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${GODOT_ASSET}"
          echo "Downloading $url"
          curl --fail --location --silent --show-error \
               --retry 3 --retry-delay 5 --retry-all-errors \
               --output "${RUNNER_TEMP}/godot.zip" "$url"
          printf '%s  %s\n' "$GODOT_SHA512" "${RUNNER_TEMP}/godot.zip" \
            | sha512sum --check --strict
          unzip -q "${RUNNER_TEMP}/godot.zip" -d "${RUNNER_TEMP}/godot"
          binary="${RUNNER_TEMP}/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          if [[ ! -f "$binary" ]]; then
            echo "The pinned archive did not contain $binary. Its contents were:" >&2
            ls -la "${RUNNER_TEMP}/godot" >&2
            exit 1
          fi
          chmod +x "$binary"
          echo "GODOT=$binary" >> "$GITHUB_ENV"

      # debug, matching godot-suites: the .gdextension resolves
      # linux.debug.x86_64 for a debug engine run, and a scene whose script
      # reaches the bridge renders what the suites test rather than a fallback.
      - name: Build the native bridge
        shell: bash
        run: bash tools/build-native-bridge.sh debug

      - name: Render every scene
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            bash tools/capture-scenes.sh 2>&1 | tee "${RUNNER_TEMP}/captures.log"

      # if-no-files-found: error, not warn. An empty captures artifact is the
      # exact failure this job exists to make impossible, so it fails the job
      # rather than uploading nothing quietly.
      - name: Upload the captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-${{ github.sha }}
          path: work/captures/
          if-no-files-found: error

      - name: Upload the capture log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-log-${{ github.sha }}
          path: ${{ runner.temp }}/captures.log
          if-no-files-found: warn
