[package]
name = "project42_sim"
version = "0.1.0"
edition = "2024"
description = "Deterministic gameplay simulation for Project 42: Pirate Island RPG"
license = "Proprietary"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
godot-ext = ["dep:godot"]

[dependencies]
godot = { version = "0.5.5", optional = true, features = ["api-4-2"] }
