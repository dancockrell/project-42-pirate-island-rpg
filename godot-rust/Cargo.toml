[package]
name = "project42_sim"
version = "0.1.0"
edition = "2024"
description = "Deterministic gameplay simulation for Project 42: Pirate Island RPG"
license = "Proprietary"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
godot-ext = ["dep:godot"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
godot = { version = "0.5.5", optional = true, features = ["api-4-2"] }

# The simulation is compute-heavy: an unoptimized test run spends its time in
# tick loops rather than finding bugs. Optimizing the test profile turns a
# multi-minute suite into a fast one without changing any command.
[profile.test]
opt-level = 2

[profile.dev]
opt-level = 1
