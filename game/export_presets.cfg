; Godot export presets. Godot's ConfigFile parser accepts ";" line comments
; (game/project.godot opens with one), but the editor REWRITES this file every
; time the Export dialog saves, and comments do not survive that rewrite. Treat
; the notes below as documentation of intent, not as a durable contract.
;
; preset.0 "Web Preview" is NOT a shipping target. It sets
; variant/extensions_support=false and excludes bin/*, so it cannot load
; project42_sim -- the GDExtension that IS the simulation. It exists only to
; serve a look-at-it build through tools/src/serve-web-preview.mjs. Every rule
; in godot-rust/ is absent from anything this preset produces. Do not ship it,
; and do not "fix" it by flipping extensions_support without also shipping a
; web build of the Rust library. It is kept deliberately, not by neglect.
;
; preset.1 / preset.2 / preset.3 are the desktop shipping targets. Each leaves
; exclude_filter empty so bin/ is not stripped, and names the .gdextension plus
; its own platform's expedition_v5 debug and release libraries in include_filter.
; Library paths are exactly those declared in game/bin/project42_sim.gdextension.

[preset.0]

name="Web Preview (preview only -- no GDExtension, not shippable)"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="bin/*"
export_path="../work/web-preview/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=true
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0, 0, 0, 1)

